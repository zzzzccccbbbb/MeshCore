; Meshnology M19: ESP32-S3 + LR2021 + MCP23017 + ST7789 240x240
; Companion UI: ST7789LCDDisplay framebuffer, @@MAC8 (screen == BLE), five-way ADC
; Hardware truth: ~/esp32/m19/m19 board_pins.h

[meshnology_m19]
extends = esp32_base
board = meshnology_m19
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/meshnology_m19
  -D MESHNOLOGY_M19
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D USE_LR2021
  -D NEOPIXEL_LED=46
  -D NEOPIXEL_BRIGHTNESS=64
  -D P_LORA_DIO_1=38
  -D LR2021_IRQ_DIO=7
  -D P_LORA_NSS=8
  -D P_LORA_SCLK=18
  -D P_LORA_MOSI=17
  -D P_LORA_MISO=11
  -D P_LORA_BUSY=12
  -D LR2021_TCXO_VOLTAGE=1.8f
  -D RF_SWITCH_TABLE
  -D PIN_USER_BTN=0
  -D PIN_BACK_BTN=0
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D LORA_FREQ=915.23
  -D PIN_GPS_RX=44
  -D PIN_GPS_TX=43
  -D PIN_VBAT_READ=1
  -D PIN_BOARD_SDA=14
  -D PIN_BOARD_SCL=15
  -D PIN_TFT_CS=21
  -D PIN_TFT_DC=6
  -D PIN_TFT_RST=-1
  -D PIN_TFT_LEDA_CTL=5
  -D DISPLAY_ROTATION=2
  -D DISPLAY_WIDTH=240
  -D DISPLAY_HEIGHT=240
  -D DISPLAY_SCALE_X=1.875f
  -D DISPLAY_SCALE_Y=3.75f
  ; Logical size 1 → physical 2 (was truncated to 1 and looked tiny)
  -D DISPLAY_TEXT_SCALE=2.0f
  -D ADC_MULTIPLIER=5.28f
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology_m19>
  +<helpers/Mcp23017Helper.cpp>
  +<helpers/Mcp23017Hal.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  adafruit/Adafruit GFX Library @ ^1.12.1

; ---- No-display smoke ----
[env:meshnology_m19_terminal_chat]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
build_src_filter = ${meshnology_m19.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${meshnology_m19.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_m19_kiss_modem]
extends = meshnology_m19
build_src_filter = ${meshnology_m19.build_src_filter}
  +<../examples/kiss_modem/>

; ---- Display envs (W13-style ST7789LCDDisplay framebuffer) ----
[env:meshnology_m19_repeater]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D ADVERT_NAME='"Meshnology M19 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${meshnology_m19.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:meshnology_m19_room_server]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D ADVERT_NAME='"Meshnology M19 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${meshnology_m19.lib_deps}
  ${esp32_ota.lib_deps}

[env:meshnology_m19_companion_radio_usb]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D UI_HAS_JOYSTICK=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"@@MAC8"'
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_m19.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_m19_companion_radio_ble]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D UI_HAS_JOYSTICK=1
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"@@MAC8"'
  -D BLE_NAME_PREFIX='""'
  -D BLE_DEVICE_NAME='"@@MAC8"'
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_m19.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_m19_companion_radio_wifi]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D UI_HAS_JOYSTICK=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"@@MAC8"'
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_m19.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_m19_sensor]
extends = meshnology_m19
build_flags =
  ${meshnology_m19.build_flags}
  -D ADVERT_NAME='"Meshnology M19 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D BOARD_DISPLAY_NAME='"Meshnology M19"'
build_src_filter = ${meshnology_m19.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_sensor>
lib_deps =
  ${meshnology_m19.lib_deps}
  ${esp32_ota.lib_deps}
