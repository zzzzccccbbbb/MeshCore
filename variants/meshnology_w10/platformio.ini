; Meshnology W10: ESP32-S3 + SX1262 + MCP23017 IO expander + ST7796 240x240 square LCD

[meshnology_w10]
extends = esp32_base
board = meshnology_w10
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshnology_w10
  -D MESHNOLOGY_W10
  -D ESP32_CPU_FREQ=80
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_SCLK=12
  -D P_LORA_MOSI=13
  -D P_LORA_MISO=11
  -D P_LORA_NSS=14
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=0.0f
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=7
  -D PIN_USER_BTN=0
  -D PIN_TFT_CS=10
  -D PIN_TFT_DC=16
  -D PIN_TFT_RST=-1
  -D PIN_TFT_LEDA_CTL=6
  -D DISPLAY_ROTATION=2
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology_w10>
  +<helpers/Mcp23017Helper.cpp>
  +<helpers/Mcp23017Hal.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  lewisxhe/XPowersLib @ ^0.2.7

[env:meshnology_w10_repeater]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -D DISPLAY_CLASS=ST7796Display
  -D ADVERT_NAME='"Meshnology W10 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${meshnology_w10.build_src_filter}
  +<helpers/ui/ST7796Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${meshnology_w10.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:meshnology_w10_companion_radio_usb]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7796Display
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W10"'
  -D BOARD_DISPLAY_NAME='"Meshnology W10"'
build_src_filter = ${meshnology_w10.build_src_filter}
  +<helpers/ui/ST7796Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w10.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w10_companion_radio_ble]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7796Display
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W10"'
  -D BLE_NAME_PREFIX='"Meshnology-"'
  -D BLE_DEVICE_NAME='"@@MAC4"'
  -D BOARD_DISPLAY_NAME='"Meshnology W10"'
build_src_filter = ${meshnology_w10.build_src_filter}
  +<helpers/ui/ST7796Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w10.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w10_companion_radio_wifi]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7796Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W10"'
  -D BOARD_DISPLAY_NAME='"Meshnology W10"'
build_src_filter = ${meshnology_w10.build_src_filter}
  +<helpers/ui/ST7796Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w10.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w10_room_server]
extends = meshnology_w10
build_flags =
  ${meshnology_w10.build_flags}
  ${sensor_base.build_flags}
  -D ENV_INCLUDE_GPS=1
  -D DISPLAY_CLASS=ST7796Display
  -D ADVERT_NAME='"Meshnology W10 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${meshnology_w10.build_src_filter}
  +<helpers/ui/ST7796Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${meshnology_w10.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
