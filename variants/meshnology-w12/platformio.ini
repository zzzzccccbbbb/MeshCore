; Meshnology W12 W12-MB: ESP32-S3 + LR2021 + external Sub-G/2.4G PA
; Pins / RF DIO from ~/esp32/w12/w12_demo/w12_factory

[Meshnology_W12]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshnology-w12
  -D MESHNOLOGY_W12
  -D ESP32_CPU_FREQ=80
  -D P_LORA_SCLK=9
  -D P_LORA_MOSI=10
  -D P_LORA_MISO=11
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_DIO_1=14
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LR2021_IRQ_DIO=8
  -D LR2021_W12_RF_SWITCH=1
  -D LR2021_RX_BOOST_LEVEL=7
  -D LORA_TX_POWER=22
  -D RADIOLIB_EXCLUDE_SX126X=1
  -D PIN_GSUB_POWER=4
  -D PIN_G24_POWER=3
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_VEXT_EN=45
  -D PIN_USER_BTN=0
  -D PIN_OLED_RESET=47
  -D DISPLAY_ADDRESS=0x3C
  -D PIN_VBAT_READ=1
  -D PIN_ADC_CTRL=2
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology-w12>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:Meshnology_W12_companion_radio_ble]
extends = Meshnology_W12
build_flags =
  ${Meshnology_W12.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W12"'
  -D BLE_NAME_PREFIX='"Meshnology-"'
  -D BOARD_DISPLAY_NAME='"Meshnology W12"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W12.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Meshnology_W12.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshnology_W12_companion_radio_usb]
extends = Meshnology_W12
build_flags =
  ${Meshnology_W12.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W12"'
  -D BOARD_DISPLAY_NAME='"Meshnology W12"'
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W12.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Meshnology_W12.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshnology_W12_companion_radio_wifi]
extends = Meshnology_W12
build_flags =
  ${Meshnology_W12.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W12"'
  -D BOARD_DISPLAY_NAME='"Meshnology W12"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W12.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Meshnology_W12.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshnology_W12_repeater]
extends = Meshnology_W12
build_flags =
  ${Meshnology_W12.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Meshnology-W12 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W12.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Meshnology_W12.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:Meshnology_W12_room_server]
extends = Meshnology_W12
build_flags =
  ${Meshnology_W12.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Meshnology-W12 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W12.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Meshnology_W12.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
