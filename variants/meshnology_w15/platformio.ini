; Meshnology W15 AM36-FN: ESP32-S3 + Semtech LR2021 (LR2021MB1LDZCS switchless)
; Pins from ~/esp32/w15/w15 (lr20xx_hal.h / esp_port)

[meshnology_w15]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshnology_w15
  -D MESHNOLOGY_W15
  -D ESP32_CPU_FREQ=80
  -D P_LORA_SCLK=40
  -D P_LORA_MOSI=41
  -D P_LORA_MISO=42
  -D P_LORA_NSS=39
  -D P_LORA_RESET=38
  -D P_LORA_BUSY=17
  -D P_LORA_DIO_1=21
  -D USE_LR2021
  -D RADIO_CLASS=CustomLR2021
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D LR2021_IRQ_DIO=7
  -D LR2021_AM36_RF_SWITCH=1
  -D LR2021_RX_BOOST_LEVEL=7
  -D LORA_TX_POWER=22
  -D RADIOLIB_EXCLUDE_SX126X=1
  -D PIN_BOARD_SDA=5
  -D PIN_BOARD_SCL=4
  -D PIN_VEXT_EN=45
  -D PIN_USER_BTN=0
  -D PIN_OLED_RESET=-1
  -D DISPLAY_ADDRESS=0x3C
  -D DISPLAY_ROTATION=2
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology_w15>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:meshnology_w15_companion_radio_ble]
extends = meshnology_w15
build_flags =
  ${meshnology_w15.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W15"'
  -D BLE_NAME_PREFIX='"Meshnology-"'
  -D BLE_DEVICE_NAME='"@@MAC4"'
  -D BOARD_DISPLAY_NAME='"Meshnology W15"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshnology_w15.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w15.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w15_companion_radio_usb]
extends = meshnology_w15
build_flags =
  ${meshnology_w15.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W15"'
  -D BOARD_DISPLAY_NAME='"Meshnology W15"'
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${meshnology_w15.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w15.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w15_companion_radio_wifi]
extends = meshnology_w15
build_flags =
  ${meshnology_w15.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Meshnology-W15"'
  -D BOARD_DISPLAY_NAME='"Meshnology W15"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshnology_w15.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w15.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w15_repeater]
extends = meshnology_w15
build_flags =
  ${meshnology_w15.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Meshnology-W15 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshnology_w15.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${meshnology_w15.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:meshnology_w15_room_server]
extends = meshnology_w15
build_flags =
  ${meshnology_w15.build_flags}
  ${sensor_base.build_flags}
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Meshnology-W15 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshnology_w15.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${meshnology_w15.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
