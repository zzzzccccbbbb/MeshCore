; Meshnology W20 — full Deck Pro LVGL menu + MeshCore on Mesh entry
; UI from w20_meshtastic Deck Pro; only Mesh page runs MeshCore companion.

[meshnology_w20]
extends = esp32_base
board = w20-meshnology
; Align with Meshtastic W20 (partition + LittleFS + flash)
board_build.partitions = partition-table-16MB.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
; WiFi 浏览器 OTA：生成 w20-firmware-ota.bin（首字节 0x57，文件名须含 w20）
extra_scripts =
  ${esp32_base.extra_scripts}
  post:extra_scripts/w20_ota_wrap.py
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshnology_w20
  -I src/platform/w20_mt_stubs
  -I src/platform/w20_deckpro
  -I src/platform/w20_deckpro/src
  -I src/platform/w20_deckpro/config
  -I src/platform/w20_deckpro_shell
  -I src/helpers/w20
  -I lib/SensorLib/src
  -I lib/esp_lora_lr2021/common
  -I lib/esp_lora_lr2021/lr20xx_driver/inc
  -I lib/esp_lora_lr2021/shields/lr20xx/inc
  -I lib/esp_lora_lr2021/common/printers
  -I examples/companion_radio
  -I examples/companion_radio/ui-new
  -D MESHNOLOGY_W20
  -D W20_MESHNOLOGY
  -D USE_W20_DECKPRO_SHELL
  -D MESHCORE_DECK_SHELL
  ; Keep 240 MHz through LoRa HAL init (meshtastic only downclocks after RF up).
  ; -D ESP32_CPU_FREQ=80
  -D BOARD_HAS_PSRAM
  ; MeshCore EPD: X+Y flip to match Deck (no setRotation — keeps glyphs readable)
  -D W20_MESHCORE_EPD_FLIP_Y=1
  -D W20_MESHCORE_EPD_FLIP_X=1
  ; LoRa LR2021 — Semtech HAL owns SPI2_HOST (no RadioLib on W20)
  -D P_LORA_SCLK=12
  -D P_LORA_MOSI=13
  -D P_LORA_MISO=11
  -D P_LORA_NSS=1
  -D P_LORA_RESET=14
  -D P_LORA_BUSY=4
  -D P_LORA_DIO_1=5
  -D P_LORA_EN=39
  -D USE_LR2021
  -D W20_LORA_HAS_TCXO=1
  -D W20_USE_SEMTECH_RADIO=1
  -D WRAPPER_CLASS=W20SemtechRadio
  -D LR2021_RX_BOOST_LEVEL=7
  -D LORA_TX_POWER=22
  -D RADIOLIB_EXCLUDE_SX126X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=7
  -D PIN_USER_BTN=0
  ; E-Ink / Deck Pro
  -D USE_EINK
  -D EINK_DISPLAY_MODEL=GxEPD2_310_DEPG0310BxU253
  -D EINK_WIDTH=240
  -D EINK_HEIGHT=320
  -D EINK_SCALE_X=1.875f
  -D EINK_SCALE_Y=2.5f
  -D W20_DECKPRO_FLIP_Y=0
  -D W20_DECKPRO_EPD_HOLD_IMAGE=1
  -D W20_DECK_SLEEP_WIFI_OFF=1
  -D W20_PARTITION_16MB=1
  -D AUTO_OFF_MILLIS=0
  -D DISPLAY_CLASS=W20ShellEpdDisplay
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -include src/platform/w20_deckpro/config/lv_conf.h
  -UENV_INCLUDE_GPS
  -UENV_INCLUDE_VL53L0X
  -D W20_LOG_UI=0
  -D W20_LOG_BAT=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/meshnology_w20>
  +<helpers/sensors>
  +<helpers/w20>
  +<../src/platform/w20_mt_stubs/w20_mt_stubs.cpp>
  +<../src/platform/w20_deckpro>
  -<../src/platform/w20_deckpro/peri_ltr553.cpp>
  -<../src/platform/w20_deckpro/peri_gyroscope.cpp>
  +<../src/platform/w20_deckpro_shell>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.12.1
  bakercp/CRC32 @ ^2.0.0
  lvgl/lvgl@~8.3.9
  mikalhart/TinyGPSPlus @ ^1.0.3
  ; Local libs (Deck Pro)
  file://lib/GxEPD2
  file://lib/SensorLib
  file://lib/IP5356
  file://lib/esp_lora_lr2021

[env:meshnology_w20_companion_radio_ble]
extends = meshnology_w20
build_flags =
  ${meshnology_w20.build_flags}
  -D MAX_CONTACTS=120
  -D MAX_GROUP_CHANNELS=16
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=0
  -D OFFLINE_QUEUE_SIZE=64
  -D ADVERT_NAME='"Meshnology-W20"'
  -D BLE_NAME_PREFIX='"Meshnology-"'
  -D BLE_DEVICE_NAME='"@@MAC4"'
  -D BOARD_DISPLAY_NAME='"Meshnology W20"'
  -D UI_RECENT_LIST_SIZE=6
build_src_filter = ${meshnology_w20.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w20.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:meshnology_w20_companion_radio_usb]
extends = meshnology_w20
build_flags =
  ${meshnology_w20.build_flags}
  -D MAX_CONTACTS=120
  -D MAX_GROUP_CHANNELS=16
  -D OFFLINE_QUEUE_SIZE=64
  -D ADVERT_NAME='"Meshnology-W20"'
  -D BOARD_DISPLAY_NAME='"Meshnology W20"'
  -D UI_RECENT_LIST_SIZE=6
build_src_filter = ${meshnology_w20.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshnology_w20.lib_deps}
  densaugeo/base64 @ ~1.4.0
