; Meshnology W13 OLED (SH1106 on I2C)
; Shared board sources live here; e-ink envs are in variants/meshnology-w13-eink/
; board.json variant name (meshnology_w13) intentionally differs from this folder
; so FrameworkArduinoVariant does not compile Board/target sources.
;
; Suite (aligned with meshnology-w15; no WiFi on nRF52840):
;   companion_radio_ble / companion_radio_usb / repeater / room_server

[Meshnology_W13]
extends = nrf52_base
board = meshnology-w13
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/meshnology-w13
  -D MESHNOLOGY_W13
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D GPS_BAUD_RATE=9600
  -D DISABLE_DIAGNOSTIC_OUTPUT
  -D PIN_OLED_RESET=-1
  -D DISPLAY_ADDRESS=0x3C
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/meshnology-w13>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/sensors>
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SH110X @ ^2.1.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:Meshnology_W13_companion_radio_ble]
extends = Meshnology_W13
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${Meshnology_W13.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D PIN_BUZZER=32
  -D QSPIFLASH=1
  -D ADVERT_NAME='"Meshnology-W13"'
  -D BLE_NAME_PREFIX='"Meshnology-"'
  -D BOARD_DISPLAY_NAME='"Meshnology W13"'
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W13.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Meshnology_W13.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:Meshnology_W13_companion_radio_usb]
extends = Meshnology_W13
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${Meshnology_W13.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=32
  -D QSPIFLASH=1
  -D ADVERT_NAME='"Meshnology-W13"'
  -D BOARD_DISPLAY_NAME='"Meshnology W13"'
  -D UI_RECENT_LIST_SIZE=6
  -D UI_SENSORS_PAGE=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Meshnology_W13.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Meshnology_W13.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:Meshnology_W13_repeater]
extends = Meshnology_W13
build_src_filter = ${Meshnology_W13.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_repeater>
build_flags =
  ${Meshnology_W13.build_flags}
  -D ADVERT_NAME='"Meshnology-W13 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SH1106Display
  -D BOARD_DISPLAY_NAME='"Meshnology W13"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Meshnology_W13.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:Meshnology_W13_room_server]
extends = Meshnology_W13
build_src_filter = ${Meshnology_W13.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/simple_room_server>
build_flags = ${Meshnology_W13.build_flags}
  -D ADVERT_NAME='"Meshnology-W13 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D DISPLAY_CLASS=SH1106Display
  -D BOARD_DISPLAY_NAME='"Meshnology W13"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${Meshnology_W13.lib_deps}
  adafruit/RTClib @ ^2.1.3
